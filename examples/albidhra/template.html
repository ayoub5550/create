<!doctype html>
<html lang="ar" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="engine/ink.js"></script>
    <script src="engine/stickfilm.js"></script>
    <script src="film_clips.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Ruqaa"; src: url("fonts/ArefRuqaa-ar.woff2") format("woff2"); font-weight: 700; font-display: block; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbfaf6; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fbfaf6; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #paper { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(60,50,30,0.10) 100%); }
      #title { position: absolute; top: 48px; left: 0; width: 1920px; text-align: center; direction: rtl;
        font-family: "Ruqaa", serif; font-weight: 700; font-size: 118px; color: #2b2a28; opacity: 0; }
      #ul { position: absolute; top: 222px; left: 540px; width: 840px; height: 40px; overflow: visible; }
      #night { position: absolute; inset: 0; background: #4d5d96; mix-blend-mode: multiply; opacity: 0; pointer-events: none; }
      #sky { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
      #fade { position: absolute; inset: 0; background: #fbfaf6; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <section id="scene" class="clip" data-start="0" data-duration="60" data-track-index="1">
        <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence id="boilTurb" type="fractalNoise" baseFrequency="0.013" numOctaves="1" seed="1" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
            </filter>
            <radialGradient id="sunGlow">
              <stop offset="0" stop-color="#f7b955" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#f7b955" stop-opacity="0"/>
            </radialGradient>
            <clipPath id="aboveGround"><rect id="agRect" x="-3000" y="-3000" width="9000" height="3820"/></clipPath>
          </defs>
          <g id="cam">
            <g id="back"></g>
            <g id="land" filter="url(#boil)"></g>
            <g id="fx"></g>
            <g id="fig"></g>
            <g id="pencil" opacity="0">
              <g transform="rotate(-38)">
                <path d="M 0 0 L 14 -34 L -14 -34 Z" fill="#e9d3a8" stroke="#2b2a28" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 0 0 L 5 -12 L -5 -12 Z" fill="#2b2a28"/>
                <rect x="-14" y="-214" width="28" height="180" fill="#f2b233" stroke="#2b2a28" stroke-width="4"/>
                <line x1="-4.5" y1="-210" x2="-4.5" y2="-38" stroke="#2b2a28" stroke-width="2" opacity="0.35"/>
                <line x1="4.5" y1="-210" x2="4.5" y2="-38" stroke="#2b2a28" stroke-width="2" opacity="0.35"/>
                <rect x="-14" y="-240" width="28" height="26" fill="#d9d4ca" stroke="#2b2a28" stroke-width="4"/>
                <rect x="-14" y="-262" width="28" height="24" rx="8" fill="#e58f8f" stroke="#2b2a28" stroke-width="4"/>
              </g>
            </g>
          </g>
        </svg>
        <div id="night"></div>
        <svg id="sky" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><g id="skyg"></g></svg>
        <div id="paper"></div>
        <div id="title">ما تزرعُهُ اليومَ يُظلِّلُكَ غداً</div>
        <svg id="ul" viewBox="0 0 840 40"><path id="underline" d="M 825 18 C 620 30, 360 8, 15 22" fill="none" stroke="#e8772e" stroke-width="7" stroke-linecap="round"/></svg>
        <div id="fade"></div>
      </section>
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="60" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
%FILM%
    </script>
  </body>
</html>
