<!doctype html>
<!-- Sam & Layla Ep. 1 — shared page skeleton for every part (films/film1/common/template.html).
     Layers back to front: #sky (screen) · #far · #mid · #haze · #cam [#land · #back · #props · #fig · #front] · #fore
     · paper grain + vignette · #over [#weather · #ui (screen-space props, bubbles, insets) · #fxg (fades, iris)] · #card.
     build.sh copies it into the part (token %FILM% = the part's film.js, %DUR% = timeline total). -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="engine/ink.js"></script>
    <script src="engine/stickfilm.js"></script>
    <script src="engine/talk.js"></script>
    <script src="engine/shots.js"></script>
    <script src="common/set.js"></script>
    <script src="common/props.js"></script>
    <script src="common/kit.js"></script>
    <script src="film_clips.js"></script>
    <script src="film_data.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat-latin.woff2") format("woff2"); font-weight: 400 700; font-display: block; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6f1e6; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f6f1e6; }
      #stage, #over { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #grain { position: absolute; inset: 0; pointer-events: none; background: url("common/paper.png") repeat; background-size: 512px 512px;
        mix-blend-mode: multiply; opacity: 0.55; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(50,40,25,0.16) 100%); }
      #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #2b2a28; font-family: "Caveat", cursive; font-weight: 700; opacity: 0; pointer-events: none;
        background-color: #f6f1e6; background-image: linear-gradient(rgba(246,241,230,0.72), rgba(246,241,230,0.72)), url("common/paper.png");
        background-size: auto, 512px 512px; }
      #card .c1 { font-size: 210px; line-height: 1.0; letter-spacing: 0.01em; }
      #card .c2 { font-size: 92px; line-height: 1.25; color: #c4453b; }
      #card .c3 { font-size: 64px; line-height: 1.3; color: #2f7f8f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%DUR%" data-width="1920" data-height="1080">
      <section id="scene" class="clip" data-start="0" data-duration="%DUR%" data-track-index="1">
        <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs></defs>
          <g id="sky"></g>
          <g id="far"></g>
          <g id="mid"></g>
          <g id="haze"></g>
          <g id="cam">
            <g id="land"></g>
            <g id="back"></g>
            <g id="props"></g>
            <g id="fig"></g>
            <g id="front"></g>
          </g>
          <g id="fore"></g>
        </svg>
        <div id="grain"></div>
        <div id="vignette"></div>
        <svg id="over" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><g id="weather"></g><g id="ui"></g><g id="fxg"></g></svg>
        <div id="card"><div class="c1"></div><div class="c2"></div><div class="c3"></div></div>
      </section>
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="%DUR%" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
%FILM%
    </script>
  </body>
</html>
